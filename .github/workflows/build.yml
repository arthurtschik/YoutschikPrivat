name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doppelten Build für denselben Stand überspringen
        id: chk
        run: |
          git fetch --tags --quiet
          if git tag --points-at HEAD | grep -q '^build-'; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.chk.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.chk.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - if: steps.chk.outputs.skip != 'true'
        name: Build
        run: gradle :app:assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_updateToken: ${{ secrets.UPDATE_TOKEN }}
      - if: steps.chk.outputs.skip != 'true'
        name: Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk YoutschikPrivat.apk
          gh release create "build-${{ github.run_number }}" YoutschikPrivat.apk --title "Build ${{ github.run_number }}" --notes "Automatischer Build"
        env:
          GH_TOKEN: ${{ github.token }}
