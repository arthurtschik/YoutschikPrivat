name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_updateToken: ${{ secrets.UPDATE_TOKEN }}
      - name: Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk YoutschikPrivat.apk
          gh release create "build-${{ github.run_number }}" YoutschikPrivat.apk --title "Build ${{ github.run_number }}" --notes "Automatischer Build"
        env:
          GH_TOKEN: ${{ github.token }}
